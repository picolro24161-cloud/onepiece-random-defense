# 원피스 랜덤 디펜스 - Netlify 배포 설정
[build]
  publish = "."

# 에셋은 파일명이 내용 해시라 내용이 바뀌면 파일명도 바뀐다 → 영구 캐시 안전
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html 은 항상 최신을 받아야 함
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
